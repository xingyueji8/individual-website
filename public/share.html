<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>作品分享 · 星月集</title>
  <link rel="icon" href="/assets/avatar-glass.png" type="image/png">
  <link rel="stylesheet" href="/share.css?v=20261114-article-images">
  <link rel="stylesheet" href="/media-performance.css?v=20261111-video-compat">
  <script src="/video-playback.js?v=20261111-video-compat" defer></script>
  <script src="/share.js?v=20261114-article-images" defer></script>
</head>
<body>
  <header class="share-header">
    <a class="brand" href="/" data-site-navigation>星月集<span>作品分享</span></a>
    <nav aria-label="网站导航">
      <a href="/#essays" data-site-navigation>文章</a>
      <a href="/#photos" data-site-navigation>图片</a>
      <a href="/#resources" data-site-navigation>文件与视频</a>
      <a href="/#about" data-site-navigation>关于我</a>
      <button type="button" data-login-prompt>注册／登录</button>
    </nav>
  </header>
  <main>
    <div class="share-intro">
      <p class="eyebrow">站长分享的作品</p>
      <h1 id="share-title">正在打开分享…</h1>
      <p id="share-description"></p>
      <p id="share-status" role="status" aria-live="polite">正在确认链接与浏览权限</p>
    </div>
    <nav id="share-folders" class="share-folders" aria-label="本次分享的小板块" hidden></nav>
    <section id="share-works" class="share-works" aria-label="分享的作品"></section>
    <article id="share-reader" class="share-reader" hidden>
      <div class="reader-toolbar">
        <button id="share-back" type="button">返回分享列表</button>
        <button id="share-pdf" type="button">下载文章 PDF</button>
      </div>
      <h2 id="reader-title"></h2>
      <p id="reader-meta" class="reader-meta"></p>
      <div id="reader-body" class="reader-body"></div>
      <section id="reader-attachments" aria-label="本文附件"></section>
    </article>
  </main>
  <footer>分享入口仅开放本次分享的作品。浏览更多内容，请注册／登录。</footer>
  <dialog id="share-image-dialog" class="share-image-dialog" aria-label="图片预览">
    <div id="share-image-stage" class="share-image-stage">
      <img id="share-image-preview" alt="图片预览" decoding="async" draggable="false">
      <p id="share-image-status" role="status" aria-live="polite" hidden></p>
    </div>
    <div class="share-image-toolbar">
      <button id="share-image-previous" type="button" aria-label="上一张图片">上一张</button>
      <button id="share-image-next" type="button" aria-label="下一张图片">下一张</button>
      <p id="share-image-caption" aria-live="polite"></p>
      <button id="share-image-zoom" type="button" aria-pressed="false">放大图片</button>
      <button id="share-image-close" type="button" autofocus>关闭图片预览</button>
    </div>
  </dialog>
  <dialog id="share-login-dialog" aria-labelledby="share-login-title">
    <h2 id="share-login-title">注册／登录后继续浏览</h2>
    <p>当前链接只允许浏览所分享的作品。访问其他板块、评论或使用网站功能，请先注册／登录。</p>
    <div class="dialog-actions">
      <a id="share-register" class="primary" href="/login?mode=register&amp;next=/">注册账号</a>
      <a id="share-login" class="primary" href="/login?next=/">登录账号</a>
      <button id="share-login-close" type="button">继续看分享</button>
    </div>
  </dialog>
</body>
</html>
