<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PDF 导出核验</title>
<style>
    /* =========================================================
       01. 全局基础与主题颜色
       ---------------------------------------------------------
       想统一修改网站配色时，优先改 :root 中的颜色变量。
       例如 --blue 是主蓝色，--cyan 是强调色，--cream 是背景色。
       ========================================================= */
    * { box-sizing: border-box; }
    :root {
      --cream: #ffffff;
      --paper: #ffffff;
      --ink: #203037;
      --muted: #718087;
      --line: #e4e7e4;
      --blue: #77a1cd;
      --cyan: #31bfc8;
      --cyan-soft: #e2f7f8;
      --sand: #eee8dd;
      --accent: #c4735a;
      --shadow: 0 18px 50px rgba(28, 52, 60, .10);
      --radius: 18px;

      /*
         全站只使用三套正文风格和一套代码字体：
         1. --font-ui：普通正文与表单，圆润、稍粗；
         2. --font-display：标题与重点信息，更粗、更有层级；
         3. --font-reading：文章和长段落，保持舒适行距；
         4. --font-code：只供代码与链接编号使用。
         ui-rounded / SF Pro Rounded 在苹果设备优先生效，Windows 会回退到
         微软雅黑 UI，鸿蒙设备会优先使用 HarmonyOS Sans SC。
      */
      --font-ui: ui-rounded, "SF Pro Rounded", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      --font-display: "Yuanti SC", "YouYuan", ui-rounded, "Arial Rounded MT Bold", "SF Pro Rounded", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      --font-reading: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      --font-code: ui-monospace, "SFMono-Regular", Consolas, monospace;
      /* 登录、注册和需要明确状态的按钮使用黑体，避免浅色照片上出现细字发虚。 */
      --font-hei: "Heiti SC", "SimHei", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;

      /*
         纯玻璃控件的统一参数
         ------------------------------------------------------
         “纯玻璃”不再依靠大面积半透明白色和强模糊，而是依靠：
         1. 极低透明度的环境色；2. 清晰的高光边缘；3. 上亮下暗的内折射。
         --glass-fill / --glass-fill-hover 控制玻璃本体，保持较低数值才能
         让背景真正透出来；--glass-line 与 --glass-shadow 负责晶体轮廓。
      */
      --glass-fill: rgba(255, 255, 255, .065);
      --glass-fill-hover: rgba(255, 255, 255, .14);
      --glass-line: rgba(255, 255, 255, .70);
      --glass-shadow:
        0 9px 24px rgba(32, 48, 55, .11),
        inset 0 1px 0 rgba(255, 255, 255, .88),
        inset 1px 0 0 rgba(255, 255, 255, .25),
        inset 0 -1px 0 rgba(64, 94, 108, .16);
    }

    html, body { margin: 0; min-height: 100%; }
    /* hidden 属性用于在“入口界面”和“网站主体”之间切换，必须高于普通布局样式。 */
    [hidden] { display: none !important; }
    body {
      font-family: var(--font-ui);
      font-weight: 520;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 5%, rgba(49,191,200,.12), transparent 32%),
        var(--cream);
      overflow: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button, .btn, .tab-button { font-weight: 760; }
    button { color: inherit; }
    a { color: var(--blue); }

    /* =========================================================
       02. 页面总体布局
       ---------------------------------------------------------
       .app-shell：包住侧边栏与主内容区。
       .sidebar：电脑端左侧栏；手机端会在媒体查询中变成顶部栏。
       ========================================================= */
    .app-shell { display: flex; min-height: 100dvh; height: 100dvh; }
    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      height: 100dvh;
      padding: 34px 22px 24px;
      position: relative;
      z-index: 20;
      border-right: 1px solid rgba(255, 255, 255, .76);
      /*
         侧边栏是半透明的毛玻璃底板：透明底色保留页面环境光，较大的 blur
         负责柔化背后内容，细白边和内高光模拟 iOS 液态玻璃的折射边缘。
      */
      background:
        radial-gradient(circle at 4% 0%, rgba(255,255,255,.78), transparent 38%),
        linear-gradient(155deg, rgba(245,251,251,.48), rgba(224,239,241,.30));
      box-shadow: inset -1px 0 0 rgba(255,255,255,.62), 10px 0 34px rgba(49,86,98,.07);
      -webkit-backdrop-filter: blur(30px) saturate(1.32);
      backdrop-filter: blur(30px) saturate(1.32);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
      /*
         宽度、内边距和玻璃阴影使用同一条缓动曲线。此前内部文字直接
         display:none，导致侧栏虽然在变宽/变窄，内容却会瞬间消失；下面
         brand/nav-label/sidebar-note 的过渡会与本段保持同步。
      */
      transition:
        width .46s cubic-bezier(.22,.72,.18,1),
        flex-basis .46s cubic-bezier(.22,.72,.18,1),
        padding .46s cubic-bezier(.22,.72,.18,1),
        border-color .24s ease,
        box-shadow .24s ease;
    }
    /*
       浏览器放大后可视高度会明显变小。flex 子项默认允许收缩，会把头像区和
       底部版本信息压扁到看不见，却不会增加 scrollHeight。禁止侧栏直属子项
       收缩后，头像、全部导航、外观和后台入口会共同进入同一个纵向滚动范围。
    */
    .sidebar > * { flex-shrink: 0; }
    .sidebar-toggle {
      width: 40px; height: 40px; flex: 0 0 40px; margin: -11px 0 16px -7px;
      border: 1px solid var(--glass-line); border-radius: 13px; cursor: pointer;
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.018) 48%, rgba(119,161,205,.055));
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(2px) saturate(1.12) contrast(1.04);
      backdrop-filter: blur(2px) saturate(1.12) contrast(1.04);
      display: grid; place-items: center; color: var(--muted); font-size: 1.2rem;
      transition: color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .sidebar-toggle:hover {
      color: var(--ink); background: rgba(255,255,255,.15);
      transform: translateY(-1px); box-shadow: 0 13px 30px rgba(32,48,55,.14), inset 0 1px 0 white;
    }
    .sidebar-toggle:active { transform: translateY(1px) scale(.95); }
    .sidebar-toggle:focus-visible { outline: 3px solid rgba(119,161,205,.28); }
    .brand {
      display: flex; align-items: center; gap: 13px; margin-bottom: 28px;
      max-height: 82px; opacity: 1; transform: translateX(0) scale(1);
      overflow: hidden; visibility: visible;
      transition:
        max-height .42s cubic-bezier(.22,.72,.18,1),
        margin .42s cubic-bezier(.22,.72,.18,1),
        opacity .26s ease,
        transform .42s cubic-bezier(.22,.72,.18,1),
        visibility 0s linear 0s;
    }

    /* =========================================================
       03. 头像按钮与完整果冻刷新动画
       ---------------------------------------------------------
       尺寸：修改 .avatar-refresh 的 width/height。
       动画强度：修改 @keyframes avatar-jelly-refresh 中的 scale。
       点击后的刷新逻辑在文件底部搜索“头像点击刷新”。
       ========================================================= */
    .avatar-refresh {
      width: 66px; height: 66px; flex: 0 0 66px; padding: 0;
      border: 0; border-radius: 50%; overflow: visible;
      /*
         渐变毛玻璃环已经写入 /assets/avatar-glass.png，并且图片外侧是真实
         透明区域。因此按钮本身不再叠加第二层 CSS 圆环，只保留轻微悬浮阴影。
      */
      background: transparent;
      box-shadow:
        0 10px 24px rgba(44,88,104,.16),
        0 2px 7px rgba(119,161,205,.10);
      cursor: pointer;
      transition: transform .1s cubic-bezier(.175,.885,.32,1.275), box-shadow .1s ease;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .avatar-refresh:hover {
      transform: scale(1.09) rotate(-4deg);
      box-shadow: 0 14px 30px rgba(44,88,104,.22), 0 3px 9px rgba(119,161,205,.14);
    }
    .avatar-refresh:focus-visible { outline: 3px solid rgba(33,127,186,.28); outline-offset: 4px; }
    /*
       恢复上一版 1.18 秒头像果冻：压扁、拉长并逐级收束。头像是刷新入口，
       因而保留完整果冻过程；普通按钮仍只进行一次快速回弹，两者互不影响。
    */
    .avatar-refresh.jelly { animation: avatar-jelly-refresh 1.18s cubic-bezier(.22,.72,.22,1) both; }
    .avatar {
      width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none;
      border: 0; border-radius: 50%;
    }
    @keyframes avatar-jelly-refresh {
      0%   { transform: translateY(0) scale(1,1) rotate(0); }
      11%  { transform: translateY(7px) scale(1.25,.75) rotate(-6deg); }
      24%  { transform: translateY(-11px) scale(.82,1.25) rotate(7deg); }
      38%  { transform: translateY(3px) scale(1.17,.86) rotate(-5deg); }
      52%  { transform: translateY(-5px) scale(.90,1.14) rotate(4deg); }
      66%  { transform: translateY(2px) scale(1.09,.93) rotate(-2.5deg); }
      79%  { transform: translateY(-2px) scale(.965,1.06) rotate(1.5deg); }
      90%  { transform: translateY(1px) scale(1.025,.985) rotate(-.6deg); }
      100% { transform: translateY(0) scale(1,1) rotate(0); }
    }

    /*
       侧边栏名称、导航按钮和后台入口
       --------------------------------------------------------
       导航采用透明晶体玻璃：背景几乎完全透出，只用边缘高光、微弱折射
       与内阴影表现厚度；当前页面额外加入少量蓝青环境色。
    */
    .brand h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 1.28rem; font-weight: 700; }
    .brand small { color: var(--muted); letter-spacing: .12em; }
    .nav { display: grid; gap: 7px; }
    .nav button {
      width: 100%; border: 1px solid rgba(255,255,255,.72); border-radius: 15px;
      /* 默认也带一层极淡蓝色，不再使用容易和背景融为一体的白色渐变。 */
      background: rgba(112,164,188,.12);
      padding: 11px 13px; text-align: left; cursor: pointer; color: var(--ink);
      display: flex; align-items: center; gap: 11px; white-space: nowrap;
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(2px) saturate(1.12) contrast(1.04);
      backdrop-filter: blur(2px) saturate(1.12) contrast(1.04);
      transition: color .18s ease, background .18s ease, border-color .18s ease,
                  transform .18s ease, box-shadow .18s ease, gap .36s ease,
                  padding .42s cubic-bezier(.22,.72,.18,1);
    }
    .nav button[hidden] { display: none; }
    .nav-icon { width: 22px; flex: 0 0 22px; text-align: center; font-size: 1.05rem; }
    .nav-label {
      min-width: 0; max-width: 166px; opacity: 1; overflow: hidden;
      transform: translateX(0); visibility: visible;
      transition:
        max-width .40s cubic-bezier(.22,.72,.18,1),
        opacity .24s ease,
        transform .40s cubic-bezier(.22,.72,.18,1),
        visibility 0s linear 0s;
    }
    .nav button:hover {
      color: var(--ink); border-color: rgba(255,255,255,.88);
      background: rgba(98,171,190,.23);
      box-shadow: var(--glass-shadow); transform: translateY(-1px);
    }
    .nav button:active { transform: translateY(1px) scale(.975); }
    .nav button:focus-visible,
    .studio-link:focus-visible,
    .tab-button:focus-visible {
      outline: 3px solid rgba(49,191,200,.28);
      outline-offset: 2px;
    }
    .nav button.active {
      color: #17343d; border-color: rgba(255,255,255,.82);
      /* 当前板块保持清晰的蓝青色，导航完成后不会重新变回透明白色。 */
      background: rgba(75,166,185,.40);
      box-shadow: 0 11px 25px rgba(74,129,146,.17), inset 0 1px 0 rgba(255,255,255,.94), inset 0 -1px 0 rgba(45,110,126,.17);
    }
    /*
       “安装桌面应用”是浏览器工具，不属于主页、个人空间等内容专栏。
       因此它不再放进 .nav，而是作为独立工具行固定在“外观”选择器下方。
       按钮仍沿用全站的蓝色玻璃层次，避免被误认为普通文字链接。
    */
    .sidebar-install-slot {
      width: 100%; padding-top: 8px; max-height: 64px;
      opacity: 1; visibility: visible; transform: translateY(0);
      transition:
        max-height .34s cubic-bezier(.22,.72,.18,1),
        padding .34s ease,
        opacity .20s ease,
        transform .34s cubic-bezier(.22,.72,.18,1),
        visibility 0s linear 0s;
    }
    .sidebar-install-button {
      width: 100%; min-height: 44px; padding: 9px 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--glass-line); border-radius: 15px; cursor: pointer;
      color: var(--ink); background: rgba(70, 166, 184, .24);
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(15px) saturate(1.18);
      backdrop-filter: blur(15px) saturate(1.18);
      transition: color .16s ease, background .16s ease, border-color .16s ease,
                  transform .16s ease, box-shadow .16s ease, padding .34s ease;
    }
    .sidebar-install-button:hover {
      color: var(--ink); border-color: rgba(255,255,255,.88);
      background: rgba(57, 173, 190, .34); transform: translateY(-1px);
    }
    .sidebar-install-button:active { transform: translateY(1px) scale(.975); }
    .sidebar-install-button:focus-visible {
      outline: 3px solid rgba(49,191,200,.28); outline-offset: 2px;
    }
    .sidebar-install-icon { width: 22px; flex: 0 0 22px; text-align: center; font-size: 1.05rem; }
    .sidebar-install-label {
      min-width: 0; max-width: 156px; overflow: hidden; opacity: 1;
      white-space: nowrap; transform: translateX(0); visibility: visible;
      font-size: .80rem; font-weight: 800;
      transition: max-width .34s cubic-bezier(.22,.72,.18,1), opacity .20s ease,
                  transform .34s cubic-bezier(.22,.72,.18,1), visibility 0s linear 0s;
    }
    .sidebar-note {
      margin-top: 10px; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); max-height: 140px;
      font-size: .76rem; line-height: 1.65; color: var(--muted);
      opacity: 1; overflow: hidden; visibility: visible; transform: translateY(0);
      transition:
        max-height .42s cubic-bezier(.22,.72,.18,1),
        margin .42s ease,
        padding .42s ease,
        opacity .24s ease,
        transform .42s cubic-bezier(.22,.72,.18,1),
        visibility 0s linear 0s;
    }
    .studio-link {
      display: inline-flex; align-items: center; margin-top: 9px; padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.58); border-radius: 999px;
      color: var(--muted); text-decoration: none; background: var(--glass-fill);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.74);
      -webkit-backdrop-filter: blur(2px) saturate(1.1); backdrop-filter: blur(2px) saturate(1.1);
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }
    .studio-link:hover { color: var(--ink); background: var(--glass-fill-hover); transform: translateY(-1px); }

    /*
       侧边栏收起后保留 76px 图标轨道和展开按钮。站名、文字与页脚隐藏，
       data-title 仍通过浏览器 title 提示各图标含义。
    */
    .app-shell.sidebar-collapsed .sidebar { width: 76px; flex-basis: 76px; padding-inline: 13px; }
    .app-shell.sidebar-collapsed .sidebar-toggle { margin-left: 5px; }
    .app-shell.sidebar-collapsed .brand {
      max-height: 0; margin-bottom: 0; opacity: 0;
      transform: translateX(-9px) scale(.92); visibility: hidden; pointer-events: none;
      transition-delay: 0s, 0s, 0s, 0s, .42s;
    }
    .app-shell.sidebar-collapsed .nav button { justify-content: center; gap: 0; padding-inline: 10px; }
    .app-shell.sidebar-collapsed .nav-label {
      max-width: 0; opacity: 0; transform: translateX(-7px); visibility: hidden;
      transition-delay: 0s, 0s, 0s, .40s;
    }
    /* 电脑端收起侧栏后仍保留安装图标，但隐藏文字，行为与外观按钮一致。 */
    .app-shell.sidebar-collapsed .sidebar-install-slot { display: grid; justify-items: center; }
    .app-shell.sidebar-collapsed .sidebar-install-button { width: 44px; padding-inline: 0; gap: 0; }
    .app-shell.sidebar-collapsed .sidebar-install-label {
      max-width: 0; opacity: 0; transform: translateX(-7px);
      visibility: hidden; pointer-events: none;
      transition-delay: 0s, 0s, 0s, .34s;
    }
    .app-shell.sidebar-collapsed .sidebar-note {
      max-height: 0; margin: 0; padding: 0; opacity: 0;
      transform: translateY(7px); visibility: hidden; pointer-events: none;
      transition-delay: 0s, 0s, 0s, 0s, 0s, .42s;
    }

    /*
       原生橡皮筋只在部分触控浏览器提供。JavaScript 在侧栏已经到顶/到底后
       继续滚动时添加下面两个类，让侧栏内容产生很短的边界回弹；不阻止原生
       滚动，因此支持 iOS 橡皮筋的设备仍优先使用系统手感。
    */
    .sidebar.sidebar-edge-bounce-top > *,
    .sidebar.sidebar-edge-bounce-bottom > * { will-change: transform; }
    .sidebar.sidebar-edge-bounce-top > * {
      animation: sidebar-edge-bounce-top .30s cubic-bezier(.2,.78,.22,1);
    }
    .sidebar.sidebar-edge-bounce-bottom > * {
      animation: sidebar-edge-bounce-bottom .30s cubic-bezier(.2,.78,.22,1);
    }
    @keyframes sidebar-edge-bounce-top {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(5px); }
    }
    @keyframes sidebar-edge-bounce-bottom {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-5px); }
    }

    /* =========================================================
       04. 主内容区与通用文字
       ---------------------------------------------------------
       每个 .content-section 都能独立纵向滚动，这是手机适配的关键。
       ========================================================= */
    .main { flex: 1; min-width: 0; height: 100dvh; overflow: hidden; }
    .content-section {
      display: none;
      height: 100%;
      overflow: auto;
      /* 隔离各板块的布局与绘制，切换时不让浏览器重新计算整个网站外壳。 */
      contain: layout paint;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: clamp(34px, 6vw, 78px) clamp(24px, 7vw, 94px) 80px;
      scrollbar-gutter: stable;
    }
    /*
       板块切换不再对整页文字执行 blur。模糊会迫使浏览器逐帧重绘大量字形，
       首页文字较多时尤其容易显得卡顿；现在只保留 0.18 秒淡入和 4px 位移。
       section-entering 只在用户主动切换时临时添加；页面刷新恢复板块时不添加，
       因而目标内容会在首帧直接就位。
    */
    .content-section.active { display: block; }
    .content-section.active.section-entering {
      animation: section-arrive .18s cubic-bezier(.2,.72,.2,1) both;
    }
    @keyframes section-arrive {
      from { opacity: .62; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .section-inner { width: min(980px, 100%); margin: 0 auto; }

    /* 阅读弹窗仍会使用 .eyebrow 显示内容类型，因此保留这组通用小标题样式。 */
    .eyebrow {
      margin: 0 0 9px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    /* 恢复网站最初的大标题字形；圆润字体继续用于正文、表单和小型控件。 */
    h1 { margin: 0; font-family: KaiTi, "Songti SC", serif; font-size: clamp(1.6rem, 6vw, 3.8rem); line-height: 1.08; font-weight: 700; letter-spacing: normal; }
    .lead { max-width: 720px; margin: 20px 0 0; color: var(--muted); line-height: 1.9; font-size: 1rem; }
    /* 首页“本站使用说明”：正文由 Studio 的网站设置读取，此处只负责毛玻璃外观。 */
    .usage-guide {
      max-width: 760px; margin: 26px 0 0; padding: 25px 28px;
      border: 1px solid rgba(255,255,255,.80); border-radius: 24px;
      background:
        radial-gradient(circle at 8% 0%, rgba(255,255,255,.82), transparent 40%),
        linear-gradient(145deg, rgba(255,255,255,.42), rgba(220,239,241,.22));
      box-shadow: 0 18px 48px rgba(39,74,86,.11), inset 0 1px 0 rgba(255,255,255,.94);
      -webkit-backdrop-filter: blur(24px) saturate(1.25);
      backdrop-filter: blur(24px) saturate(1.25);
    }
    .usage-guide h2 {
      margin: 0 0 18px; text-align: center; font-family: var(--font-display);
      font-size: 1.34rem; font-weight: 860; color: var(--ink);
    }
    .usage-guide p {
      margin: 0 0 12px; text-indent: 2em; color: #253b43; line-height: 1.95;
      font-family: var(--font-reading); font-weight: 650; white-space: pre-wrap;
    }
    .usage-guide p:last-child { margin-bottom: 0; }
    .divider { height: 1px; background: var(--line); margin: 30px 0; }
    .section-title { margin: 0 0 8px; font: 400 clamp(1.5rem, 3vw, 2.2rem)/1.2 Georgia, "Songti SC", serif; }
    .section-desc { margin: 0; color: var(--muted); line-height: 1.7; }

    /* =========================================================
       通用按钮
       ---------------------------------------------------------
       首页聊天、文章互动、评论发表和图片下载都会使用 .btn。
       修改圆角、颜色或间距时，只需在这里统一调整。
       ========================================================= */
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 17px;
      cursor: pointer;
      background: var(--ink);
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(0,0,0,.13); }
    .btn:disabled { cursor: not-allowed; opacity: .58; transform: none; box-shadow: none; }
    .btn.light { background: white; color: var(--blue); }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn.small { padding: 7px 12px; font-size: .84rem; }

    /*
       网站主体中的操作按钮
       --------------------------------------------------------
       基础 .btn 仍供登录入口使用；下面只覆盖进入网站后的 .app-shell 与
       各类弹窗，因此不会改变刚刚确认好的登录界面层级。

       主要操作（提交、发送、保存）使用带蓝青环境色的透明晶体玻璃；
       ghost/light 作为无色晶体。背景模糊只有 2px，不会再形成白雾。
    */
    .app-shell .btn,
    dialog .btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      color: #15343c;
      background: rgba(54,158,177,.48);
      box-shadow:
        0 9px 23px rgba(43,102,119,.16),
        inset 0 1px 0 rgba(255,255,255,.90),
        inset 1px 0 0 rgba(255,255,255,.25),
        inset 0 -1px 0 rgba(20,74,91,.22);
      -webkit-backdrop-filter: blur(13px) saturate(1.16);
      backdrop-filter: blur(13px) saturate(1.16);
      text-shadow: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease,
                  background .18s ease, opacity .18s ease;
    }
    .app-shell .btn.ghost,
    dialog .btn.ghost {
      color: var(--ink);
      border-color: var(--glass-line);
      background: rgba(109,158,194,.24);
      box-shadow: var(--glass-shadow);
      text-shadow: none;
    }
    .app-shell .btn.light,
    dialog .btn.light {
      color: #356f98;
      border-color: rgba(255,255,255,.82);
      background: rgba(92,174,188,.22);
      box-shadow: var(--glass-shadow);
      text-shadow: none;
    }
    .app-shell .btn:hover,
    dialog .btn:hover {
      border-color: rgba(255,255,255,.96);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(43,102,119,.22), inset 0 1px 0 #fff;
    }
    .app-shell .btn:active,
    dialog .btn:active { transform: translateY(1px) scale(.965); }
    .app-shell .btn:focus-visible,
    dialog .btn:focus-visible { outline: 3px solid rgba(49,191,200,.30); outline-offset: 2px; }
    .app-shell .btn:disabled,
    dialog .btn:disabled { transform: none; box-shadow: none; }

    /*
       全站按钮的“按下 → 单次越界回弹 → 回到原位”动效。
       is-control-pressed 由 pointerdown 添加；control-bounce-release 在松手时
       只越过原尺寸一次，不再来回振荡。JavaScript 使用事件委托，所以后台
       数据动态生成的按钮也能自动获得动效。
    */
    :is(button, a.btn, .tab-button, .studio-link, [role="button"], .content-card, .photo-card) {
      -webkit-tap-highlight-color: transparent;
      transform-origin: center;
      will-change: transform;
    }
    :is(button, a.btn, .tab-button, .studio-link, [role="button"], .content-card, .photo-card):not(.image-nav).control-bounce-release {
      animation: control-single-rebound .30s cubic-bezier(.16,.78,.22,1) both !important;
    }
    @keyframes control-single-rebound {
      0%   { transform: translateZ(0) scale(1); }
      16%  { transform: translate3d(0,1px,0) scale(.965); }
      58%  { transform: translate3d(0,-3px,0) scale(1.045); }
      100% { transform: none; }
    }
    /* 普通按钮松手后的短暂蓝青反馈；选中型按钮则由 .active 长久保留颜色。 */
    :is(button, a.btn, .tab-button, .studio-link, [role="button"]):not(.image-nav).control-bounce-release:not(.active):not(.danger) {
      background-color: rgba(54,158,177,.34) !important;
      border-color: rgba(47,142,162,.56) !important;
    }

    /*
       “沉浸光感”白光扩散
       --------------------------------------------------------
       每次按钮松开时，JavaScript 会在点击点创建一个临时 span。多个偏心
       径向渐变叠在一起，形成不规则的柔光团；它向四周扩散并逐渐消失，
       刻意不使用圆形描边，因此看起来更像白色染料在水中散开，而非波纹圈。
    */
    .harmony-light-bloom {
      --bloom-size: 72px;
      position: fixed;
      z-index: 2147483646;
      left: 0; top: 0;
      width: var(--bloom-size); height: var(--bloom-size);
      border-radius: 46% 54% 58% 42% / 52% 42% 58% 48%;
      pointer-events: none;
      opacity: .68;
      transform: translate(-50%, -50%) scale(.82);
      background:
        radial-gradient(ellipse at 42% 48%, rgba(255,255,255,.92) 0 7%, rgba(255,255,255,.43) 24%, rgba(255,255,255,.11) 48%, transparent 72%),
        radial-gradient(ellipse at 66% 35%, rgba(255,255,255,.54), transparent 52%),
        radial-gradient(ellipse at 29% 70%, rgba(229,251,255,.44), transparent 54%);
      filter: blur(1.8px);
      mix-blend-mode: screen;
      /* 按住期间停留在 hold-in 的末帧，白光不会自行消散。 */
      animation: harmony-light-hold-in .11s cubic-bezier(.18,.72,.2,1) both;
    }
    .harmony-light-bloom.is-releasing {
      animation: harmony-light-diffuse .30s cubic-bezier(.12,.68,.18,1) both;
    }
    .harmony-light-bloom::before,
    .harmony-light-bloom::after {
      content: ""; position: absolute; pointer-events: none; border-radius: inherit;
      background: radial-gradient(ellipse, rgba(255,255,255,.52), transparent 68%);
    }
    .harmony-light-bloom::before { inset: 18% -13% 4% 31%; transform: rotate(23deg); }
    .harmony-light-bloom::after { inset: 35% 29% -12% -9%; transform: rotate(-31deg); }
    @keyframes harmony-light-hold-in {
      from { opacity: .24; transform: translate(-50%, -50%) scale(.20) rotate(-4deg); }
      to   { opacity: .68; transform: translate(-50%, -50%) scale(.82) rotate(0); }
    }
    @keyframes harmony-light-diffuse {
      0%   { opacity: .68; transform: translate(-50%, -50%) scale(.82) rotate(0); }
      52%  { opacity: .34; transform: translate(-50%, -50%) scale(1.03) rotate(4deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.38, 1.28) rotate(7deg); filter: blur(3px); }
    }

    /*
       站内运行时反机器人拦截层
       --------------------------------------------------------
       Worker 判定为高置信度自动化后，本层会立即盖住所有页面内容并让主体
       失去交互能力。浏览器若拒绝脚本关闭手动打开的标签页，本层会继续保留，
       不会重新露出网站内容。
    */
    .runtime-security-block {
      position: fixed; z-index: 2147483647; inset: 0;
      display: grid; place-items: center; padding: 24px;
      color: #effcff; background: rgba(7,18,25,.88);
      -webkit-backdrop-filter: blur(22px) saturate(1.18);
      backdrop-filter: blur(22px) saturate(1.18);
    }
    .runtime-security-block[hidden] { display: none; }
    .runtime-security-card {
      width: min(520px, 100%); padding: clamp(28px, 6vw, 48px);
      text-align: center; border: 1px solid rgba(218,249,255,.46); border-radius: 28px;
      background: rgba(39,74,84,.42);
      box-shadow: 0 24px 70px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.34);
    }
    .runtime-security-symbol { font-size: 2.4rem; line-height: 1; margin-bottom: 17px; }
    .runtime-security-card h1 { margin: 0 0 14px; font-size: clamp(1.55rem, 4vw, 2.15rem); }
    .runtime-security-card p { margin: 0; line-height: 1.85; color: rgba(239,252,255,.84); }
    .runtime-security-card p + p { margin-top: 9px; font-size: .82rem; color: rgba(239,252,255,.62); }

    /* =========================================================
       05. 网站第一层：全屏登录 / 游客入口
       ---------------------------------------------------------
       这是访问根网址后首先显示的界面。账号登录成功或主动选择
       “游客浏览”以后，JavaScript 才会隐藏本层并显示 .app-shell。
       ========================================================= */
    .entry-screen {
      position: relative;
      isolation: isolate;
      height: 100dvh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #f3f2ed;
    }

    /*
     * 登录背景在电脑和手机上都使用清晰 cover 铺满。之前手机端额外叠加了
     * 一张模糊 fill 图，即使主体照片没有滤镜，视觉上仍会像蒙了一层雾。
     * 现在只保留清晰主图；必要的裁切由 object-fit: cover 自然完成。
     */
    .entry-photo-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #15191b;
    }
    .entry-photo-background::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: transparent;
    }
    .entry-photo-frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.15s ease;
    }
    .entry-photo-frame img {
      position: absolute;
      display: block;
      user-select: none;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .entry-photo-frame .photo-complete {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: none;
    }
    .entry-photo-frame.active { opacity: 1; animation: entry-bg-fade 1.25s ease both; }
    .entry-photo-frame.active.effect-wipe-left { animation-name: entry-bg-wipe-left; }
    .entry-photo-frame.active.effect-wipe-right { animation-name: entry-bg-wipe-right; }
    .entry-photo-frame.active.effect-reveal-center { animation-name: entry-bg-reveal-center; }
    @keyframes entry-bg-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes entry-bg-wipe-left { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
    @keyframes entry-bg-wipe-right { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
    @keyframes entry-bg-reveal-center { from { clip-path: inset(0 50%); } to { clip-path: inset(0); } }
    @media (prefers-reduced-motion: reduce) {
      .entry-photo-frame { transition: opacity .25s ease; animation: none !important; }
    }
    .entry-card {
      position: relative;
      z-index: 3;
      flex: 0 0 auto;
      margin-block: auto;
      /*
         入口登录框由原来的 430px 加宽到 520px；上下仅保留 28px，左右使用
         更宽的自适应留白，从而形成“更宽、更矮”的横向比例。
      */
      width: min(520px, 100%);
      padding: 28px clamp(30px, 5vw, 50px);
      overflow: hidden;
      border: 0;
      border-radius: 30px;
      /*
         中心只有轻微磨砂感，向四周逐渐减弱为近乎透明的玻璃。真正的边缘
         放大与模糊由 .liquid-glass-refraction 中同步的背景副本完成，因此这里
         不再使用一条白色 border 假装玻璃轮廓。
      */
      background:
        radial-gradient(ellipse 88% 82% at 50% 47%, rgba(247,252,252,.22) 0%, rgba(239,249,250,.13) 44%, rgba(223,244,247,.045) 72%, transparent 100%);
      box-shadow:
        0 30px 84px rgba(17,38,45,.25),
        inset 0 0 34px rgba(255,255,255,.08),
        inset 0 -12px 30px rgba(56,105,119,.055);
      -webkit-backdrop-filter: blur(3.5px) saturate(1.10) contrast(1.025);
      backdrop-filter: blur(3.5px) saturate(1.10) contrast(1.025);
      animation: entry-rise .38s ease both;
      /* 浅色照片上不使用白色文字光晕，避免字形边缘发虚。 */
      text-shadow: none;
    }
    .entry-card::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse 76% 72% at 50% 46%, rgba(255,255,255,.16), rgba(255,255,255,.07) 46%, transparent 86%);
      -webkit-backdrop-filter: blur(7px) saturate(1.08);
      backdrop-filter: blur(7px) saturate(1.08);
      -webkit-mask-image: radial-gradient(ellipse 84% 80% at 50% 48%, #000 0 43%, rgba(0,0,0,.72) 61%, rgba(0,0,0,.16) 82%, transparent 100%);
      mask-image: radial-gradient(ellipse 84% 80% at 50% 48%, #000 0 43%, rgba(0,0,0,.72) 61%, rgba(0,0,0,.16) 82%, transparent 100%);
    }
    .entry-card > * { position: relative; z-index: 2; }
    .entry-card > .liquid-glass-refraction { position: absolute; z-index: 0; }
    @keyframes entry-rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    /* 七个汉字在电脑和手机卡片中都保持同一行，避免最后一个“集”单独换行。 */
    .entry-card h1 { margin: 0; text-align: center; font-size: clamp(1.85rem, 6vw, 2.45rem); white-space: nowrap; }
    .entry-subtitle { margin: 7px auto 18px; text-align: center; color: var(--muted); line-height: 1.6; }
    .entry-form { display: grid; gap: 12px; }
    .entry-field { display: grid; gap: 7px; color: var(--ink); font-size: .88rem; font-weight: 700; }
    .entry-field input {
      width: 100%; border: 1px solid rgba(255,255,255,.78); border-radius: 15px;
      padding: 12px 14px; background: rgba(255,255,255,.075); color: var(--ink); outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.91), inset 0 -1px 0 rgba(44,85,99,.12), 0 7px 18px rgba(31,62,72,.07);
      -webkit-backdrop-filter: blur(2px) saturate(1.08); backdrop-filter: blur(2px) saturate(1.08);
      text-shadow: none;
    }
    .entry-field input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(49,191,200,.12); }
    .entry-options { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .82rem; }
    .entry-options label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .entry-options input { accent-color: var(--cyan); }
    .entry-link { color: #258e99; text-decoration: none; font-weight: 700; }
    .entry-link:hover { text-decoration: underline; }
    .entry-primary {
      width: 100%; min-height: 46px; border: 1px solid rgba(255,255,255,.72);
      color: #12343c;
      background: rgba(49,169,184,.56);
      box-shadow: 0 12px 27px rgba(26,112,127,.22), inset 0 1px 0 rgba(255,255,255,.90), inset 0 -1px 0 rgba(17,91,105,.20);
      -webkit-backdrop-filter: blur(15px) saturate(1.16); backdrop-filter: blur(15px) saturate(1.16);
    }
    .entry-actions .btn.ghost {
      color: #17343d; border-color: rgba(255,255,255,.78); background: rgba(105,158,195,.32);
      box-shadow: 0 9px 22px rgba(31,62,72,.09), inset 0 1px 0 rgba(255,255,255,.90);
      -webkit-backdrop-filter: blur(15px) saturate(1.14); backdrop-filter: blur(15px) saturate(1.14);
    }
    .entry-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: .78rem; }
    .entry-divider::before, .entry-divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .entry-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .entry-actions .btn,
    .entry-primary {
      width: 100%; min-height: 44px;
      font-family: var(--font-hei);
      font-weight: 800;
      text-shadow: none;
    }
    .entry-note { margin: 14px 0 0; color: var(--muted); text-align: center; font-size: .78rem; line-height: 1.55; }
    .guest-turnstile-wrap {
      display: grid; place-items: center; width: 100%; min-height: 65px; margin: -3px 0 13px;
      min-width: 0; overflow: visible; border-radius: 12px;
    }
    .guest-turnstile-wrap[hidden] { display: none; }
    .guest-turnstile-wrap.is-compact { min-height: 145px; }
    /* flexible 模式下限制 Cloudflare 外层节点与 iframe 不超过卡片实际宽度。 */
    .guest-turnstile-wrap > div,
    .guest-turnstile-wrap iframe { max-width: 100% !important; }
    .guest-privacy-note { margin-top: 8px; font-size: .72rem; }

    /* =========================================================
       05. 首页版本更新记录
       ---------------------------------------------------------
       内容来自后台的“更新日志”；这里仅控制时间线外观。
       ========================================================= */
    .updates {
      width: min(50%, 490px); margin-top: 54px; padding: 20px;
      border: 1px solid var(--glass-line); border-radius: calc(var(--radius) + 4px);
      /* 首页唯一的大型入口按钮：用更厚的玻璃层承载更新日志预览。 */
      background:
        radial-gradient(circle at 8% 0%, rgba(255,255,255,.86), transparent 38%),
        linear-gradient(145deg, rgba(255,255,255,.54), rgba(221,239,240,.30));
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
      backdrop-filter: blur(18px) saturate(1.16);
      cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .updates:hover {
      transform: translateY(-3px); border-color: rgba(255,255,255,.95);
      box-shadow: 0 18px 42px rgba(47,88,101,.15), inset 0 1px 0 white;
    }
    .updates:active { transform: translateY(0) scale(.99); }
    .updates:focus-visible { outline: 3px solid rgba(119,161,205,.3); outline-offset: 3px; }
    .updates-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .updates-heading .section-title { margin: 0; font-size: 1.35rem; }
    .updates-more {
      padding: 6px 10px; border: 1px solid rgba(255,255,255,.72); border-radius: 999px;
      color: #47799d; background: rgba(255,255,255,.40); font-size: .8rem; white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
    }
    .timeline { margin-top: 25px; display: grid; gap: 15px; }
    .timeline-item {
      display: grid; grid-template-columns: 110px 1fr; gap: 24px; padding: 23px;
      border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.72);
    }
    .updates .timeline-item {
      grid-template-columns: 1fr; gap: 10px; padding: 16px;
      border-color: rgba(255,255,255,.72); background: rgba(255,255,255,.50);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }
    .updates-history-toolbar { margin-bottom: 24px; }
    .version { color: var(--blue); font-weight: 800; }
    .date { margin-top: 7px; color: var(--muted); font-size: .75rem; }
    .timeline-item h3 { margin: 0 0 8px; font-size: 1.06rem; }
    .timeline-item p { margin: 0; white-space: pre-wrap; color: var(--muted); line-height: 1.75; }

    /* “关于我”和“联系方式”中的信息卡片。 */
    .profile-grid { margin-top: 34px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .info-card { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.75); }
    .info-card span { display: block; color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
    .badges { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .badge { padding: 7px 13px; background: #E1C8B6; color: #176f79; border-radius: 999px; font-size: .84rem; }

    /* =========================================================
       06. 作品集：文章、图片、北京旅行指南
       ---------------------------------------------------------
       .portfolio-tabs 控制三个专栏按钮；.gallery 控制图片列数。
       ========================================================= */
    .portfolio-tabs, .album-tabs { display: flex; gap: 9px; flex-wrap: wrap; margin: 28px 0; }
    /* 个人空间的专栏/相册切换也采用轻量玻璃胶囊，与侧边导航保持一致。 */
    .tab-button {
      position: relative; isolation: isolate; overflow: hidden;
      border: 1px solid var(--glass-line); padding: 9px 15px; border-radius: 999px; cursor: pointer;
      color: var(--ink); background: rgba(107,162,188,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78), 0 6px 16px rgba(32,48,55,.06);
      -webkit-backdrop-filter: blur(2px) saturate(1.1) contrast(1.03);
      backdrop-filter: blur(2px) saturate(1.1) contrast(1.03);
      transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .tab-button:hover { background: rgba(93,170,189,.24); transform: translateY(-1px); box-shadow: var(--glass-shadow); }
    .tab-button:active { transform: translateY(1px) scale(.97); }
    .tab-button.active {
      color: #17343d; border-color: rgba(255,255,255,.86);
      background: rgba(75,166,185,.40);
      box-shadow: 0 9px 22px rgba(74,129,146,.18), inset 0 1px 0 rgba(255,255,255,.9);
    }

    /*
       少数旧浏览器若不支持 backdrop-filter，就提高底色不透明度作为回退，
       避免按钮只剩一层过淡的透明白色而导致文字难以辨认。
    */
    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .sidebar { background: rgba(246,248,246,.96); }
      .sidebar-toggle, .nav button, .sidebar-install-button, .studio-link, .tab-button, .updates { background: rgba(248,250,249,.94); }
      .nav button.active, .tab-button.active { background: #b3d3db; }
    }
    .portfolio-panel { display: none; }
    .portfolio-panel.active { display: block; animation: section-arrive .16s cubic-bezier(.2,.72,.2,1) both; }
    .content-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .content-card {
      min-height: 210px; padding: 24px; border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--paper); display: flex; flex-direction: column; cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .content-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .content-card .kind { color: var(--blue); font-size: .75rem; font-weight: 700; letter-spacing: .12em; }
    .content-card h3 { margin: 15px 0 7px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; }
    /*
      每张文章卡片在标题下独立展示发布时间和最后修改时间。
      颜色刻意使用较淡的辅助文字色，不会抢过标题和正文摘要。
    */
    .content-time-lines { display: grid; gap: 3px; margin-bottom: 11px; color: var(--muted); font-size: .72rem; line-height: 1.5; }
    .content-card p { margin: 0; color: var(--muted); line-height: 1.7; }
    .card-meta { margin-top: auto; padding-top: 19px; display: flex; justify-content: space-between; color: var(--muted); font-size: .76rem; }
    .empty { padding: 38px; border: 1px dashed #b9c7ca; border-radius: var(--radius); color: var(--muted); text-align: center; line-height: 1.8; }

    .gallery { display: grid; width: 100%; min-width: 0; max-width: 1120px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 13px; }
    .photo-card { position: relative; aspect-ratio: 4/3; border-radius: 15px; overflow: hidden; background: var(--sand); cursor: zoom-in; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
    .photo-card:hover img { transform: scale(1.045); }

    /* =========================================================
       06A. 文件资源库、文档预览与视频清晰度
       ---------------------------------------------------------
       卡片只展示 D1 元数据；文件正文始终从受权限保护的 /files/:id 读取。
       清晰度按钮只显示后台确实上传完成的版本，不会伪造不存在的画质。
       ========================================================= */
    .resource-toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin:24px 0; }
    .resource-path { color:var(--muted); font-size:.84rem; overflow-wrap:anywhere; }
    .resource-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
    .resource-card {
      min-height:155px; padding:19px; border:1px solid var(--line); border-radius:17px;
      background:var(--paper); box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
      display:flex; flex-direction:column; cursor:pointer; transition:transform .18s ease,box-shadow .18s ease;
    }
    .resource-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
    .resource-card-icon { font-size:1.85rem; line-height:1; }
    .resource-card h3 { margin:14px 0 7px; font-family:var(--font-display); font-size:1.05rem; overflow-wrap:anywhere; }
    .resource-card p { margin:0; color:var(--muted); font-size:.78rem; line-height:1.65; }
    .resource-card .resource-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:14px; }
    .resource-badge { padding:4px 8px; border-radius:999px; background:rgba(90,163,184,.15); color:#336e78; font-size:.7rem; font-weight:800; }
    .reader-body .resource-embed { margin:20px 0; }
    .reader-body .resource-card { min-height:0; padding:17px; }
    .resource-dialog { width:min(1080px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); border:0; padding:0; border-radius:23px; background:transparent; }
    .resource-view { max-height:calc(100dvh - 24px); overflow:auto; padding:clamp(18px,4vw,34px); border:1px solid rgba(255,255,255,.78); border-radius:23px; background:var(--paper); box-shadow:0 28px 80px rgba(12,36,44,.28); }
    .resource-view-header { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; }
    .resource-view-header h2 { margin:0; font-family:var(--font-display); overflow-wrap:anywhere; }
    .resource-viewer { min-height:180px; display:grid; place-items:center; border:1px solid var(--line); border-radius:15px; overflow:hidden; background:#101719; }
    .resource-viewer video { display:block; width:100%; max-height:70dvh; background:#000; }
    .resource-viewer iframe { width:100%; height:min(72dvh,760px); border:0; background:white; }
    .resource-viewer-message { padding:34px; color:var(--muted); text-align:center; line-height:1.8; background:var(--paper); width:100%; }
    .resource-options { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .resource-options .active { background:rgba(75,166,185,.44); }

    /* 留言与反馈：公开留言卡片和游客提交表单。 */
    .feedback-layout { margin-top: 30px; display: grid; grid-template-columns: minmax(260px,.8fr) minmax(0,1.2fr); gap: 18px; }
    .feedback-form, .feedback-board { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
    .feedback-form { display: grid; gap: 13px; align-content: start; }
    .feedback-form label { display: grid; gap: 7px; color: var(--muted); font-size: .8rem; font-weight: 700; }
    .feedback-form input, .feedback-form textarea, .feedback-form select { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: white; }
    .feedback-form textarea { min-height: 150px; resize: vertical; }
    .feedback-public { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px !important; color: var(--ink) !important; }
    .feedback-public input { width: auto; }
    .feedback-list { display: grid; gap: 11px; }
    .feedback-item { padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: #f9fbfa; }
    .feedback-item header { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .78rem; }
    .feedback-item strong { color: var(--ink); }
    .feedback-item p { margin: 10px 0 0; white-space: pre-wrap; line-height: 1.7; }
    /*
       公开留言下方只显示由 Studio 写入的站长回复。普通网站没有回复表单，
       即使手工调用公开 API 也没有写入 admin_reply 的路由。
    */
    .feedback-owner-reply {
      margin: 14px 0 0 18px; padding: 13px 15px;
      border: 1px solid rgba(49,191,200,.28); border-radius: 12px;
      background: rgba(226,247,248,.42); box-shadow: inset 3px 0 0 rgba(49,191,200,.66);
    }
    .feedback-owner-reply header { color: #43818a; }
    .feedback-owner-reply strong { color: #267784; }
    .feedback-board-note { margin: 4px 0 18px; color: var(--muted); font-size: .82rem; line-height: 1.6; }

    /* =========================================================
       07. AI 聊天区域
       ---------------------------------------------------------
       .bubble.ai 是 AI 气泡；.bubble.user 是访客气泡。
       ========================================================= */
    .chat-shell {
      margin-top: 30px; overflow: hidden; border: 1px solid rgba(255,255,255,.82); border-radius: 26px;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.78), transparent 38%),
        linear-gradient(145deg, rgba(255,255,255,.40), rgba(217,237,240,.22));
      box-shadow: 0 22px 58px rgba(37,75,88,.13), inset 0 1px 0 rgba(255,255,255,.96);
      -webkit-backdrop-filter: blur(26px) saturate(1.28);
      backdrop-filter: blur(26px) saturate(1.28);
    }
    .chat-messages {
      height: min(52vh, 470px); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px;
      background: linear-gradient(155deg, rgba(244,250,250,.34), rgba(255,255,255,.12));
    }
    .bubble { max-width: min(82%, 670px); padding: 11px 14px; border-radius: 16px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bubble.ai {
      align-self: flex-start; border: 1px solid rgba(255,255,255,.82); border-bottom-left-radius: 4px;
      background: rgba(255,255,255,.48); box-shadow: 0 8px 22px rgba(32,70,82,.08), inset 0 1px 0 #fff;
      -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    }
    .bubble.user {
      align-self: flex-end; border: 1px solid rgba(255,255,255,.66); border-bottom-right-radius: 4px;
      background: linear-gradient(135deg,rgba(86,143,198,.76),rgba(49,191,200,.64)); color: white;
      box-shadow: 0 9px 24px rgba(42,113,133,.17), inset 0 1px 0 rgba(255,255,255,.64);
      -webkit-backdrop-filter: blur(17px) saturate(1.26); backdrop-filter: blur(17px) saturate(1.26);
    }
    /* streaming 类只在 AI 正在生成时存在；小光标让访客能看出回答仍在继续。 */
    .bubble.ai.streaming::after {
      content: ""; display: inline-block; width: 7px; height: 1.05em; margin-left: 4px;
      vertical-align: -2px; border-radius: 2px; background: var(--cyan);
      animation: stream-cursor .75s steps(1,end) infinite;
    }
    @keyframes stream-cursor { 50% { opacity: 0; } }
    .chat-form { display: flex; gap: 10px; padding: 15px; }
    .chat-form input {
      flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.84); border-radius: 15px; padding: 12px 14px;
      color: var(--ink); background: rgba(255,255,255,.43); outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.92);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    }
    .chat-form input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(49,191,200,.13); }
    .chat-status { padding: 0 18px 12px; min-height: 22px; color: var(--muted); font-size: .78rem; }

    /* =========================================================
       08. 账户中心与登录提示
       ---------------------------------------------------------
       普通用户可以在账户中心修改昵称和密码；游客点击 AI 或账户
       中心时使用 auth-lock-dialog 提示登录，不会直接跳走当前页面。
       ========================================================= */
    .access-note {
      display: inline-flex; margin-top: 13px; padding: 7px 11px; border-radius: 999px;
      color: #3d747c; background: var(--cyan-soft); font-size: .8rem;
    }
    .account-grid { margin-top: 30px; display: grid; grid-template-columns: minmax(240px,.8fr) minmax(0,1.2fr); gap: 18px; }
    .account-card { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
    .account-card h2 { margin: 0 0 18px; font-family: var(--font-display); font-size: 1.45rem; font-weight: 820; line-height: 1.2; }
    .account-meta { display: grid; gap: 12px; margin: 18px 0 0; }
    .account-meta div { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .account-meta span { color: var(--muted); font-size: .76rem; }
    .account-meta strong { overflow-wrap: anywhere; }
    .account-form { display: grid; gap: 12px; margin-bottom: 26px; }
    .account-form:last-child { margin-bottom: 0; }
    .account-form label { display: grid; gap: 7px; color: var(--muted); font-size: .8rem; font-weight: 700; }
    .account-form input { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; outline: none; }
    .account-form input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(49,191,200,.13); }
    .account-status { display: inline-flex; padding: 6px 11px; border-radius: 999px; color: #765814; background: #fff0c8; font-size: .78rem; font-weight: 800; }
    .account-status.approved { color: #2d7159; background: #e2f5ec; }
    .account-status.rejected, .account-status.disabled { color: #954542; background: #fde9e8; }
    .auth-lock-dialog { width: min(460px, calc(100vw - 28px)); background: transparent; }
    .auth-lock-card {
      padding: 30px; text-align: center; border: 1px solid rgba(255,255,255,.80); border-radius: 22px;
      background:
        radial-gradient(circle at 12% 0%, rgba(255,255,255,.84), transparent 40%),
        linear-gradient(145deg, rgba(255,255,255,.52), rgba(218,238,240,.30));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.96);
      -webkit-backdrop-filter: blur(25px) saturate(1.28); backdrop-filter: blur(25px) saturate(1.28);
    }
    .auth-lock-symbol { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 17px; border-radius: 50%; color: #fff; background: linear-gradient(135deg,var(--blue),var(--cyan)); font-size: 1.5rem; }
    .auth-lock-card h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 1.75rem; font-weight: 830; }
    .auth-lock-card p { margin: 0 0 22px; color: var(--muted); line-height: 1.75; }
    .auth-lock-actions { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
    .install-app-dialog { width: min(490px, calc(100vw - 28px)); background: transparent; }
    .install-app-help { white-space: pre-line; text-align: left; }

    /*
       外部网址确认框
       ---------------------------------------------------------
       文章链接不会直接离开当前页面：这里先明确显示真实域名和完整地址，
       读者确认后才在新窗口打开，减少误点伪装链接的风险。
    */
    .external-link-dialog { width: min(540px, calc(100vw - 28px)); background: transparent; }
    .external-link-summary {
      display: grid; gap: 6px; margin: 0 0 22px; padding: 15px 16px; text-align: left;
      border: 1px solid rgba(255,255,255,.72); border-radius: 15px;
      background: rgba(234,247,248,.58); box-shadow: inset 0 1px 0 rgba(255,255,255,.88);
    }
    .external-link-summary span { color: var(--muted); font-size: .76rem; font-weight: 760; }
    .external-link-summary strong { color: var(--ink); font-size: 1rem; overflow-wrap: anywhere; }
    .external-link-address {
      max-height: 88px; overflow: auto; padding: 9px 10px; border-radius: 10px;
      color: #245968; background: rgba(255,255,255,.60); font-family: var(--font-code);
      font-size: .76rem; line-height: 1.55; overflow-wrap: anywhere; white-space: normal;
    }

    /* =========================================================
       09. 文章阅读弹窗、评论与图片预览弹窗
       ========================================================= */
    dialog { border: 0; padding: 0; border-radius: 22px; box-shadow: 0 30px 100px rgba(0,0,0,.28); }
    dialog::backdrop { background: rgba(18,30,34,.68); backdrop-filter: blur(4px); }
    /* 弹窗主体延迟半拍完成展开，让按钮回弹与内容出现形成连续动作。 */
    dialog[open] :is(.auth-lock-card, .reader-wrap, .image-view) {
      animation: dialog-glass-arrive .50s .08s cubic-bezier(.18,.78,.2,1) both;
    }
    @keyframes dialog-glass-arrive {
      0% { opacity: 0; transform: translateY(16px) scale(.955); filter: blur(8px); }
      62% { opacity: .94; transform: translateY(-2px) scale(1.012); filter: blur(1px); }
      100% { opacity: 1; transform: none; filter: none; }
    }
    .reader-dialog { width: min(900px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
    .reader-wrap { max-height: calc(100dvh - 24px); overflow-y: auto; padding: clamp(22px,5vw,55px); background: var(--paper); }
    .dialog-top { display: flex; justify-content: flex-end; gap: 8px; position: sticky; top: 0; z-index: 3; }
    /* 阅读弹窗顶部的下载与关闭按钮使用圆形/胶囊形透明玻璃。 */
    .icon-button {
      position: relative; isolation: isolate; overflow: hidden;
      min-width: 38px; height: 38px; padding-inline: 12px; cursor: pointer;
      border: 1px solid var(--glass-line); border-radius: 999px;
      color: var(--ink); background: linear-gradient(145deg, rgba(255,255,255,.15), rgba(222,239,241,.03));
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(2px) saturate(1.1) contrast(1.03);
      backdrop-filter: blur(2px) saturate(1.1) contrast(1.03);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .icon-button:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); box-shadow: 0 13px 28px rgba(32,48,55,.15), inset 0 1px 0 #fff; }
    .icon-button:active { transform: translateY(1px) scale(.94); }
    .icon-button:focus-visible { outline: 3px solid rgba(49,191,200,.30); outline-offset: 2px; }
    .reader-header { margin: 20px 0 28px; }
    .reader-header h2 { margin: 8px 0 12px; font-family: var(--font-display); font-size: clamp(2rem,6vw,3.5rem); font-weight: 840; line-height: 1.15; }
    /* 阅读页的两个时间各占一行，位置固定在文章标题正下方。 */
    .reader-meta { display: grid; gap: 4px; color: var(--muted); font-size: .82rem; line-height: 1.55; }
    .reader-body { font-family: var(--font-reading); font-size: 1.06rem; font-weight: 520; line-height: 2; }
    .reader-body img { display: block; max-width: 100%; height: auto; margin: 24px auto; border-radius: 12px; }
    /*
      正文图片会在 JavaScript 中变成可操作的预览入口：鼠标、键盘都能打开大图。
      这里仅提示“可以放大查看”，是否显示原片下载仍由登录权限统一控制。
    */
    .reader-body img.reader-inline-image, .ps-article-cover img.reader-inline-image {
      cursor: zoom-in;
      box-shadow: 0 10px 24px rgba(27,50,58,.10);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .reader-body img.reader-inline-image:hover, .ps-article-cover img.reader-inline-image:hover {
      transform: translateY(-2px) scale(1.008);
      box-shadow: 0 16px 34px rgba(27,50,58,.18);
      filter: saturate(1.04);
    }
    .reader-body img.reader-inline-image:focus-visible, .ps-article-cover img.reader-inline-image:focus-visible {
      outline: 3px solid rgba(49,191,200,.38);
      outline-offset: 4px;
    }
    .reader-body blockquote { margin: 24px 0; padding: 4px 0 4px 18px; border-left: 4px solid var(--cyan); color: var(--muted); }

    /*
       文章网址自动识别
       ---------------------------------------------------------
       行内网址保持为清晰的文字链接；当一个段落只包含一个网址时，JavaScript
       会把它提升为域名预览卡。卡片只展示本地解析结果，不向第三方抓取网页，
       因此不会因预览功能泄露读者 IP，也不会把外站脚本带进文章。
    */
    .reader-body a.article-smart-link:not(.article-link-card) {
      color: var(--cyan-deep); font-weight: 760; text-decoration: underline;
      text-decoration-color: rgba(35,142,155,.38); text-decoration-thickness: 2px;
      text-underline-offset: 3px; overflow-wrap: anywhere;
    }
    .reader-body a.article-smart-link:not(.article-link-card):hover {
      color: #176d7a; text-decoration-color: currentColor;
    }
    .reader-body .article-link-card {
      display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center;
      gap: 13px; margin: 20px 0; padding: 15px 16px; border: 1px solid rgba(255,255,255,.78);
      border-radius: 18px; color: var(--ink); text-decoration: none; line-height: 1.45;
      background: linear-gradient(145deg, rgba(255,255,255,.60), rgba(218,240,242,.36));
      box-shadow: 0 12px 28px rgba(32,72,83,.10), inset 0 1px 0 rgba(255,255,255,.96);
      -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .reader-body .article-link-card:hover {
      transform: translateY(-2px); border-color: rgba(49,191,200,.46);
      box-shadow: 0 17px 36px rgba(32,72,83,.16), inset 0 1px 0 rgba(255,255,255,.98);
    }
    .article-link-icon {
      width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px;
      color: #fff; background: #3a97a6; box-shadow: inset 0 1px 0 rgba(255,255,255,.52);
      font-size: 1.25rem; font-weight: 900;
    }
    .article-link-copy { min-width: 0; display: grid; gap: 2px; }
    .article-link-copy span { color: var(--muted); font-size: .72rem; font-weight: 760; letter-spacing: .04em; }
    .article-link-copy strong { overflow-wrap: anywhere; font-size: .96rem; }
    .article-link-copy small {
      display: block; color: var(--muted); font-family: var(--font-code); font-size: .70rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    function pdfFilename(title) {
      const safeTitle = String(title || "星月集文章")
        .normalize("NFKC")
        .replace(/[\\/:*?"<>|\u0000-\u001f]/g, "-")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 80);
      return `${safeTitle || "星月集文章"}.pdf`;

     * jsPDF 自带字体通常不包含中文，直接调用 pdf.text("星月集") 会出现空白或乱码。
     * 因此先用浏览器 Canvas 把中文绘制成透明 PNG，再盖到 PDF 的每一页中央。
     */
    function createPdfWatermarkDataUrl() {
      const canvas = document.createElement("canvas");
      canvas.width = 1200;
      canvas.height = 420;
      const context = canvas.getContext("2d");
      if (!context) return "";
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.translate(canvas.width / 2, canvas.height / 2);
      context.rotate(-18 * Math.PI / 180);
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.font = '800 150px "Microsoft YaHei", "PingFang SC", sans-serif';
      context.fillStyle = "rgba(49, 191, 200, 0.13)";
      context.fillText("星月集", 0, 0);
      return canvas.toDataURL("image/png");
    }

    function applyPdfWatermark(pdf) {
      const watermark = createPdfWatermarkDataUrl();
      if (!watermark || !pdf?.internal) return;
      const pageCount = pdf.internal.getNumberOfPages();
      for (let page = 1; page <= pageCount; page += 1) {
        pdf.setPage(page);
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const watermarkWidth = Math.min(pageWidth * 0.72, 155);
        const watermarkHeight = watermarkWidth * (420 / 1200);
        pdf.addImage(
          watermark,
          "PNG",
          (pageWidth - watermarkWidth) / 2,
          (pageHeight - watermarkHeight) / 2,
          watermarkWidth,
          watermarkHeight,
          "xingyueji-watermark",
          "FAST",

      }

        body.querySelectorAll("img").forEach(image => {
          const mediaId = image.dataset.mediaId || mediaIdFromUrl(image.getAttribute("src"));
          if (mediaId && !(exportContent.inlineMedia || []).some(item => item.id === mediaId && item.canDownload && !item.locked)) {
            const placeholder = document.createElement("p"); placeholder.textContent = "此图片未开放下载"; image.replaceWith(placeholder);
          } else if (mediaId) {
            const source = new URL(image.getAttribute("src"), location.href);
            source.searchParams.delete("download"); source.searchParams.set("preview", "1");
            image.src = protectedMediaUrl(`${source.pathname}${source.search}`);
          }
        });
        body.querySelectorAll("video,audio,iframe,.resource-card,.resource-embed").forEach(item => item.remove());
        exportRoot.append(kind, title, meta, body);
        const { chooseImageRatio, prepareImages, render } = globalThis.XYJArticlePdf;
        if (state.currentContent?.id !== contentId || !state.currentContent.canDownload) return;
        const imageRatio = await chooseImageRatio(exportRoot);
        if (imageRatio === null || state.currentContent?.id !== contentId || !state.currentContent.canDownload) return;
        button.textContent = "加载组件…";
        await ensurePdfLibrary();

        await prepareImages(exportRoot, { imageRatio, onProgress: (done, total) => { button.textContent = `准备图片 ${done}/${total}…`; } });
        document.body.append(exportRoot);
        button.textContent = "生成中…";
        const pdf = await render(exportRoot, {
          margin: [12, 12, 14, 12],
          filename: pdfFilename(exportContent.title),
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"], avoid: ["img", "pre", "blockquote", "table"] },
        }, { imageRatio, onProgress: (page, total) => { button.textContent = `生成第 ${page}/${total} 页…`; } });

        applyPdfWatermark(pdf);
        await api(`/api/content/${encodeURIComponent(contentId)}?download=1`);
        await pdf.save(pdfFilename(exportContent.title));
        return true;
      } catch (error) {
        console.error("PDF download failed", error);
        button.dataset.pdfError = error.message || "未知错误";
        alert(`PDF 生成失败：${button.dataset.pdfError}。请刷新页面后重试。`);
      } finally {
        exportRoot?.remove();
        state.pdfDownloading = false;
        document.querySelectorAll("#reader-print, #content-pdf").forEach((item) => { item.disabled = false; });
        button.textContent = originalLabel;
      }
    }


function photo(index){
  const canvas=document.createElement("canvas");canvas.width=900;canvas.height=1600;
  const ctx=canvas.getContext("2d"),g=ctx.createLinearGradient(0,0,900,1600);
  g.addColorStop(0,"#098dc2");g.addColorStop(.5,"#f6ae34");g.addColorStop(1,"#ce2867");
  ctx.fillStyle=g;ctx.fillRect(0,0,900,1600);
  for(let y=0;y<32;y++){for(let x=0;x<18;x++){ctx.fillStyle="hsla("+((27*x+19*y+8*index)%360)+",70%,45%,0.15)";ctx.fillRect(x*50,y*50,50,50);}}
  ctx.fillStyle="#142d3b";ctx.fillRect(100,128,700,170);ctx.fillStyle="white";ctx.font="bold 90px sans-serif";ctx.fillText("PHOTO "+(index+1),190,242);
  const url=canvas.toDataURL("image/jpeg",.9);canvas.width=canvas.height=0;return url;
}
node("open").onclick=()=>{
  const count=Number(node("case").value);
  if(article?.count!==count){
    const body=Array.from({length:count},(_,i)=>'<p>第 '+(i+1)+' 张测试照片。请确认图像完整、编号顺序正确。</p><img alt="PHOTO '+(i+1)+'" src="'+photo(i)+'">').join("");
    article={...state.currentContent,count,title:"合成图文核验 "+count+" 张",body_html:body,inlineMedia:[]};
  }
  node("reader-dialog").showModal();
};
node("close-reader").onclick=()=>node("reader-dialog").close();
node("content-pdf").onclick=async event=>{
  const button=event.currentTarget;
  result=null;
  const ok=await downloadCurrentContentPdf(button);
  node("result").textContent=ok?"已完成 "+JSON.stringify(result):"未下载";
  if(ok)node("reader-dialog").close();
};
